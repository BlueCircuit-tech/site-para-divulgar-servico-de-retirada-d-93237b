<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: '#0B1D3A',
                        ouro: '#E8A820',
                        destaque: '#D63031',
                        fundo: '#F5F3EE',
                        cartao: '#FFFFFF',
                        texto: '#16213E',
                        suave: '#7F8C8D',
                        borda: '#E0DDD6',
                    },
                    fontFamily: {
                        corpo: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ativo { color: #E8A820 !important; }
        .ativo svg { stroke: #E8A820 !important; }
        .nav-item { transition: color 0.2s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
<body class="bg-fundo text-texto font-corpo antialiased">

    <!-- Header fixo -->

            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-ouro rounded-lg flex items-center justify-center flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1D3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </div>
                <div>
                    <span class="font-extrabold text-lg leading-tight tracking-tight block">Cesar Express</span>
                    <span class="text-[10px] text-gray-300 leading-none">Retiradas no Paraguai</span>
                </div>
            </div>
            <a href="https://wa.me/5545999999999" target="_blank" rel="noopener" class="flex items-center gap-1.5 bg-green-600 hover:bg-green-500 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-full transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                </a>
            </a>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="pt-14 pb-20 min-h-screen">
        <!-- TELAS -->
    </main>

    <!-- Navegação inferior -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm border-t border-borda safe-bottom">
        <div class="flex items-center justify-around h-14 max-w-lg mx-auto">
            <button data-nav="principal" onclick="mostrarTela('principal')" class="ativo nav-item flex flex-col items-center gap-0.5 py-1.5 px-4 text-suave">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-[10px] font-bold">Início</span>
            </button>
            <button data-nav="servicos" onclick="mostrarTela('servicos')" class="nav-item flex flex-col items-center gap-0.5 py-1.5 px-4 text-suave">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
                <span class="text-[10px] font-bold">Serviços</span>
            </button>
            <button data-nav="contato" onclick="mostrarTela('contato')" class="nav-item flex flex-col items-center gap-0.5 py-1.5 px-4 text-suave">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                <span class="text-[10px] font-bold">Contato</span>
            </button>
        </div>
    </nav>

    <script>
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function (s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function (b) {
                b.classList.toggle('ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }
        document.addEventListener('DOMContentLoaded', function () {
            mostrarTela('principal');
        });
    </script>
</body>
</html>
